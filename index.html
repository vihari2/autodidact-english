<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Meu Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-panel">
        <div class="auth-box">
            <h3>Entrar</h3>
            <form id="auth-form" class="auth-form">
                <input id="email-input" type="email" placeholder="seu@email.com" required>
                <input id="password-input" type="password" placeholder="Senha" required>
                <div class="auth-actions">
                    <button type="submit" id="auth-submit">Entrar</button>
                    <button type="button" id="auth-signup" class="secondary" onclick="signUpWithEmail()">Criar conta</button>
                    <button type="button" id="auth-logout" class="danger hidden" onclick="signOut()">Sair</button>
                </div>
            </form>
            <p style="font-size: 0.85em; color: #666; text-align: center; margin-top: 15px;">
                💡 Se não tiver uma conta, preencha o email e senha e clique em <strong>"Criar conta"</strong>
            </p>
            <p id="auth-status" class="auth-status"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
